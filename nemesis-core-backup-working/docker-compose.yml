services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nemesis_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nemesis_internal

  redis:
    image: redis:7-alpine
    container_name: nemesis_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    networks:
      - nemesis_internal

  freellmapi:
    build:
      context: ./freellmapi
    container_name: nemesis_freellmapi
    restart: unless-stopped
    environment:
      PORT: 3001
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellm_data:/app/data
    networks:
      - nemesis_internal

  omniroute:
    build:
      context: ./omniroute_docker
    container_name: nemesis_omniroute
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - omniroute_data:/home/omni/.omniroute
    networks:
      - nemesis_internal

networks:
  nemesis_internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  freellm_data:
  omniroute_data:
