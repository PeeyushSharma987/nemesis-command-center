services:
  - type: web
    name: nemesis-supreme-command
    env: python
    rootDir: nemesis-core
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FOUNDER_GOD_KEY
        value: NEMESIS-GOD-KEY-987
